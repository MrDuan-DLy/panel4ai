name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'panel4ai ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads
            Grab the installer for your platform from the assets below.

            ### macOS — first-launch note (unsigned build)
            This build is ad-hoc signed only (no Apple Developer ID). macOS blocks downloads from the internet with a quarantine flag, which shows **"panel4ai.app is damaged"** or **"unidentified developer"**.

            After installing into `/Applications`, run this once in Terminal to remove the quarantine flag:

            ```
            xattr -dr com.apple.quarantine /Applications/panel4ai.app
            ```

            Then open the app normally. This is a one-time step per install.

            ### Windows
            Run the `.msi` or `.exe` installer. You may need to click "More info" → "Run anyway" on SmartScreen the first time.

            ### Linux VPS
            Download `panel4ai-server-*-linux-x86_64-musl` for a static x86_64 server binary. Verify it with the adjacent `.sha256` file, then follow the repository deployment guide.
          releaseDraft: false
          prerelease: false

  build-server:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable with musl target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .

      - name: Build static VPS server
        run: cargo build --locked --release -p panel4ai-server --target x86_64-unknown-linux-musl

      - name: Prepare release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="panel4ai-server-${version}-linux-x86_64-musl"
          install -m 0755 target/x86_64-unknown-linux-musl/release/panel4ai-server "${asset}"
          sha256sum "${asset}" > "${asset}.sha256"

      - name: Upload VPS server assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="panel4ai-server-${version}-linux-x86_64-musl"
          gh release upload "${GITHUB_REF_NAME}" "${asset}" "${asset}.sha256" --clobber
